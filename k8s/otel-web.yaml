apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-web
  namespace: observability-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-web
  template:
    metadata:
      labels:
        app: otel-web
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "demo-instrumentation"
        monitor.azure.com/enable-application-logs: "true"
    spec:
      initContainers:
        - name: install-dependencies
          image: node:20-alpine
          command: ["/bin/sh", "-c"]
          args:
            - cd /app && npm init -y >/dev/null 2>&1 && npm install express @opentelemetry/api --omit=dev
          volumeMounts:
            - name: app-data
              mountPath: /app
      containers:
        - name: web
          image: node:20-alpine
          workingDir: /app
          command: ["node", "-e"]
          args:
            - |
              const express = require("express");
              const http = require("http");
              const { SpanStatusCode, trace } = require("@opentelemetry/api");
              const app = express();
              const port = Number(process.env.PORT || 8080);
              const backendUrl = new URL(process.env.BACKEND_URL);
              const exceptionRate = Number(process.env.EXCEPTION_RATE || 0.2);

              app.get("/healthz", (_request, response) => response.status(200).send("ok"));

              app.get("/", (_request, response) => {
                if (Math.random() < exceptionRate) {
                  const error = new Error("Synthetic web exception for Application Insights");
                  trace.getActiveSpan()?.recordException(error);
                  trace.getActiveSpan()?.setStatus({ code: SpanStatusCode.ERROR, message: error.message });
                  throw error;
                }

                const backendRequest = http.get(backendUrl, (backendResponse) => {
                  let body = "";
                  backendResponse.setEncoding("utf8");
                  backendResponse.on("data", (chunk) => body += chunk);
                  backendResponse.on("end", () => {
                    if (backendResponse.statusCode !== 200) {
                      response.status(502).send("The backend returned an error.");
                      return;
                    }

                    const data = JSON.parse(body);
                    console.log(JSON.stringify({ level: "info", message: "Web request handled", backend: data.service }));
                    response.type("html").send(`<!doctype html>
              <html lang="en">
                <head><meta charset="utf-8"><title>OpenTelemetry Demo</title></head>
                <body><main><h1>OpenTelemetry auto-instrumentation</h1><p>${data.message}</p></main></body>
              </html>`);
                  });
                });

                backendRequest.on("error", (error) => {
                  console.error(JSON.stringify({ level: "error", message: "Backend request failed", error: error.message }));
                  response.status(502).send("Unable to reach the backend API.");
                });
              });

              app.use((error, _request, response, _next) => {
                console.error(error.stack);
                response.status(500).send(error.message);
              });

              app.listen(port, () => console.log(JSON.stringify({ level: "info", message: "Web app started", port })));
          env:
            - name: PORT
              value: "8080"
            - name: BACKEND_URL
              value: "http://otel-api/api/message"
            - name: EXCEPTION_RATE
              value: "0.2"
            - name: OTEL_SERVICE_NAME
              value: "otel-web"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: app-data
              mountPath: /app
      volumes:
        - name: app-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-web
  namespace: observability-demo
spec:
  selector:
    app: otel-web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: LoadBalancer