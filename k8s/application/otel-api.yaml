apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-api
  namespace: observability-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-api
  template:
    metadata:
      labels:
        app: otel-api
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "demo-instrumentation"
        monitor.azure.com/enable-application-logs: "true"
    spec:
      initContainers:
        - name: install-dependencies
          image: node:20-alpine
          command: ["/bin/sh", "-c"]
          args:
            - cd /app && npm init -y >/dev/null 2>&1 && npm install express @opentelemetry/api --omit=dev
          volumeMounts:
            - name: app-data
              mountPath: /app
      containers:
        - name: api
          image: node:20-alpine
          workingDir: /app
          command: ["node", "-e"]
          args:
            - |
              const express = require("express");
              const { SpanStatusCode, trace } = require("@opentelemetry/api");
              const app = express();
              const port = Number(process.env.PORT || 8080);
              const exceptionRate = Number(process.env.EXCEPTION_RATE || 0.2);

              app.get("/healthz", (_request, response) => response.status(200).send("ok"));

              app.get("/api/message", (_request, response) => {
                if (Math.random() < exceptionRate) {
                  const error = new Error("Synthetic API exception for Application Insights");
                  trace.getActiveSpan()?.recordException(error);
                  trace.getActiveSpan()?.setStatus({ code: SpanStatusCode.ERROR, message: error.message });
                  throw error;
                }

                console.log(JSON.stringify({ level: "info", message: "API request handled" }));
                response.json({ message: "hello from the auto-instrumented API", service: "otel-api" });
              });

              app.use((error, _request, response, _next) => {
                console.error(error.stack);
                response.status(500).json({ error: error.message, service: "otel-api" });
              });

              app.listen(port, () => console.log(JSON.stringify({ level: "info", message: "API started", port })));
          env:
            - name: PORT
              value: "8080"
            - name: EXCEPTION_RATE
              value: "0.2"
            - name: OTEL_SERVICE_NAME
              value: "otel-api"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: app-data
              mountPath: /app
      volumes:
        - name: app-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-api
  namespace: observability-demo
spec:
  selector:
    app: otel-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP